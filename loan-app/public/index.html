<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Loan Desk</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1c2420;--mu:#66726b;--ac:#1f7a4d;--acx:#fff;--bd:#dde2dc;--wa:#b45309;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b231f;--tx:#e8eee9;--mu:#93a19a;--ac:#3fbf84;--acx:#08150f;--bd:#2c3731;--wa:#f0a040;--er:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b231f;--tx:#e8eee9;--mu:#93a19a;--ac:#3fbf84;--acx:#08150f;--bd:#2c3731;--wa:#f0a040;--er:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:17px;margin:0 0 10px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--acx);cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.s{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}
.sum{background:var(--bg);border-radius:10px;padding:12px;margin-top:12px;font-size:15px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--bd)}
.pending{color:var(--wa)}.active{color:var(--ac)}.repaid{color:var(--mu)}.declined,.over{color:var(--er)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats b{font-size:20px;display:block}
.err{color:var(--er);font-size:14px;margin-top:8px}
</style></head><body><main>
<h1>Personal Loan Desk</h1>
<div class="mu">Small loans, low interest, clear dates.</div>
<div id="v"></div>
</main>
<script>
let mode="b",tok="",msg="",cfg={rate:2,max:50000},A=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=n=>"₦"+Math.round(n).toLocaleString("en-NG");
const D=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const api=async(p,b)=>{const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong");return j};
const st=l=>l.status==="active"&&Date.now()>l.due?"overdue":l.status;
function borrowHTML(){return `
<div class="card"><h2>Request a loan</h2>
<label>Invite code</label><input id="code" placeholder="Code I gave you">
<label>Full name</label><input id="nm">
<label>Phone number</label><input id="ph" inputmode="tel">
<label>Bank name</label><input id="bk" placeholder="e.g. GTBank">
<label>Account number (10 digits)</label><input id="ac" inputmode="numeric" maxlength="10">
<label>Amount (max ${N(cfg.max)})</label><input id="am" type="number" inputmode="numeric">
<label>Pay back in</label><select id="dy"><option value="7">7 days</option><option value="14">14 days</option><option value="30" selected>30 days</option><option value="60">60 days</option></select>
<div class="sum" id="sm"></div><div class="err" id="er"></div>
<div class="row"><button id="go">Submit request</button></div></div>
<div class="card"><h2>Check my loan</h2><label>Invite code</label><input id="cc"><label>Phone number used</label><input id="cp" inputmode="tel">
<div class="row"><button class="g" id="ck">Check</button></div><div id="cr"></div></div>`}
function sumUpdate(){const a=+$("am").value,d=+$("dy").value;if(!a){$("sm").innerHTML='<span class="mu">Enter an amount to see what you will owe.</span>';return}
const i=a*cfg.rate/100*d/30;$("sm").innerHTML=`<div><span>Amount</span><b>${N(a)}</b></div><div><span>Interest (${cfg.rate}% per month)</span><b>${N(i)}</b></div><div><span>Total to repay</span><b>${N(a+i)}</b></div><div><span>Due date</span><b>${D(Date.now()+d*864e5)}</b></div>`}
function loanLine(l){const s=st(l);return `<div class="sum"><div><span>${N(l.amount)} · due ${D(l.due)}</span><span class="tag ${s}">${s}</span></div><div><span>Total ${N(l.total)}</span><span>Balance ${N(Math.max(0,l.total-l.paid))}</span></div></div>`}
function draw(){$("v").innerHTML=borrowHTML();wire()}
function wire(){["am","dy"].forEach(i=>$(i).oninput=sumUpdate);sumUpdate();$("go").onclick=submit;$("ck").onclick=check}
async function submit(){const v=i=>$(i).value.trim();$("go").disabled=true;
try{const r=await api("loans",{code:v("code"),name:v("nm"),phone:v("ph"),bank:v("bk"),acct:v("ac"),amount:+v("am"),days:+v("dy")});
$("v").innerHTML=`<div class="card"><h2>Request sent ✔</h2><p>Your request is waiting for approval. You will repay <b>${N(r.total)}</b> by <b>${D(r.due)}</b>.</p><div class="row"><button id="bk2">Back</button></div></div>`;$("bk2").onclick=draw}
catch(e){$("er").textContent=e.message;$("go").disabled=false}}
async function check(){try{const r=await api("check",{phone:$("cp").value,code:$("cc").value});$("cr").innerHTML=r.loans.length?r.loans.map(loanLine).join(""):'<p class="mu">No loans found for that number.</p>'}catch(e){$("cr").innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
api("config").then(c=>{cfg=c}).catch(()=>{}).finally(draw);
</script></body></html>
