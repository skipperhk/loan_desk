<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1c2420;--mu:#66726b;--ac:#1f7a4d;--acx:#fff;--bd:#dde2dc;--wa:#b45309;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b231f;--tx:#e8eee9;--mu:#93a19a;--ac:#3fbf84;--acx:#08150f;--bd:#2c3731;--wa:#f0a040;--er:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b231f;--tx:#e8eee9;--mu:#93a19a;--ac:#3fbf84;--acx:#08150f;--bd:#2c3731;--wa:#f0a040;--er:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:17px;margin:0 0 10px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--acx);cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.s{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}
.sum{background:var(--bg);border-radius:10px;padding:12px;margin-top:12px;font-size:15px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--bd)}
.pending{color:var(--wa)}.active{color:var(--ac)}.repaid{color:var(--mu)}.declined,.over{color:var(--er)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats b{font-size:20px;display:block}
.err{color:var(--er);font-size:14px;margin-top:8px}
</style></head><body><main>
<h1>Admin</h1>
<div class="mu">Private. Do not share this link.</div>
<div id="v"></div>
</main>
<script>
let mode="b",tok="",msg="",cfg={rate:2,max:50000},A=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=n=>"₦"+Math.round(n).toLocaleString("en-NG");
const D=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const api=async(p,b)=>{const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong");return j};
const st=l=>l.status==="active"&&Date.now()>l.due?"overdue":l.status;
async function load(){try{A=await api("admin/state");cfg={rate:A.rate,max:A.max}}catch(e){tok="";msg=e.message}}
function adminHTML(){
if(!tok)return `<div class="card"><h2>Admin login</h2><input id="pn" type="password" placeholder="Admin PIN"><div class="err">${esc(msg)}</div><div class="row"><button id="lg">Unlock</button></div></div>`;
const out=A.loans.filter(l=>l.status==="active").reduce((s,l)=>s+l.total-l.paid,0);
const prof=A.loans.reduce((s,l)=>s+Math.max(0,l.paid-l.amount),0);
const L=[...A.loans].reverse().map(l=>{const s=st(l);let b="";
if(l.status==="pending")b=`<button class="s" data-a="send" data-i="${l.id}">Mark as sent</button><button class="s g" data-a="decline" data-i="${l.id}">Decline</button>`;
if(l.status==="active")b=`<button class="s" data-a="pay" data-i="${l.id}">Record repayment</button>`;
return `<div class="card"><div class="row" style="margin:0;justify-content:space-between"><b>${esc(l.name)}</b><span class="tag ${s}">${s}</span></div>
<div class="mu">${esc(l.phone)} · ${esc(l.bank)} ${esc(l.acct)}</div>
<div class="sum"><div><span>Amount</span><b>${N(l.amount)}</b></div><div><span>Total owed</span><b>${N(l.total)}</b></div><div><span>Repaid</span><b>${N(l.paid)}</b></div><div><span>Due</span><b>${D(l.due)}</b></div></div>
<div class="row">${b}</div></div>`}).join("")||'<p class="mu">No requests yet.</p>';
return `<div class="stats"><div class="card"><span class="mu">Available pool</span><b>${N(A.pool)}</b></div><div class="card"><span class="mu">Owed to you</span><b>${N(out)}</b></div><div class="card"><span class="mu">Profit so far</span><b>${N(prof)}</b></div><div class="card"><span class="mu">Requests</span><b>${A.loans.length}</b></div></div>
<div class="card"><h2>Settings</h2>
<label>Pool available to lend (₦)</label><input id="sp1" type="number" value="${A.pool}">
<label>Interest (% per month)</label><input id="sr" type="number" step="0.1" value="${A.rate}">
<label>Max per loan (₦)</label><input id="sx" type="number" value="${A.max}">
<label>Invite code (share with people you trust)</label><input id="sc" value="${esc(A.code)}">
<div class="row"><button id="ss">Save settings</button><button class="g" id="lo">Log out</button></div><div class="err" id="sm2" style="color:var(--ac)"></div></div>
<h2>Requests</h2>${L}`}
function draw(){$("v").innerHTML=adminHTML();wire()}
function wire(){
if($("lg"))$("lg").onclick=async()=>{try{const r=await api("admin/login",{pin:$("pn").value});tok=r.token;msg="";await load()}catch(e){msg=e.message}draw()};
if($("lo"))$("lo").onclick=()=>{tok="";A=null;draw()};
if($("ss"))$("ss").onclick=async()=>{try{await api("admin/settings",{pool:+$("sp1").value,rate:+$("sr").value,max:+$("sx").value,code:$("sc").value.trim()});await load();draw();$("sm2").textContent="Saved."}catch(e){alert(e.message)}};
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i))}
async function act(a,id){let b={};if(a==="pay"){const n=+prompt("Amount received (₦)?");if(!n||n<=0)return;b={amount:n}}
try{await api("admin/loans/"+id+"/"+a,b);await load();draw()}catch(e){alert(e.message)}}
draw();
</script></body></html>
